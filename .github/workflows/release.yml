name: Release

# Push a tag like v0.1.0:
#   - nl2sql-core (+ parent POM) is signed and uploaded to Maven Central
#   - the runnable REST server jar is attached to a GitHub Release
#   - the container image is published to ghcr.io/alok26sinha/nl2sql
# Secrets required (see RELEASING.md): CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build, sign and upload to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # autoPublish=false: the upload is validated, then you press "Publish" at central.sonatype.com/publishing.
        # Set the repository variable CENTRAL_AUTO_PUBLISH=true once you trust the pipeline.
        run: mvn -B -ntp -Prelease deploy -Dcentral.autoPublish=${{ vars.CENTRAL_AUTO_PUBLISH || 'false' }}
      - name: Publish GitHub release with the server jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=nl2sql-server/target/nl2sql-${GITHUB_REF_NAME#v}.jar
          sha256sum "$JAR" > "$JAR.sha256"
          gh release create "$GITHUB_REF_NAME" "$JAR" "$JAR.sha256" nl2sql.properties.example \
            --title "nl2sql $GITHUB_REF_NAME" --generate-notes

  publish-image:
    name: Publish container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alok26sinha/nl2sql
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
