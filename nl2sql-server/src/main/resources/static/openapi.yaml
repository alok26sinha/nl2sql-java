openapi: 3.0.3
info:
  title: nl2sql
  version: 0.1.0
  description: Ask a relational database questions in plain English. Generated SQL is validated (read-only SELECT on exposed tables) and run in a read-only transaction.
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
  schemas:
    Turn:
      type: object
      properties: {question: {type: string}, sql: {type: string}}
    AskRequest:
      type: object
      required: [question]
      properties:
        question: {type: string, maxLength: 4000, example: Which carriers had the most late deliveries last quarter?}
        history: {type: array, items: {$ref: '#/components/schemas/Turn'}, description: Earlier questions and their SQL, for follow-ups}
    GenerateResponse:
      type: object
      properties:
        question: {type: string}
        sql: {type: string, nullable: true}
        explanation: {type: string, nullable: true}
        clarification: {type: string, nullable: true, description: Set when the question is ambiguous; ask the user and resend}
        tables_used: {type: array, items: {type: string}}
        attempts: {type: integer}
        error: {type: string, nullable: true}
    AskResponse:
      allOf:
        - $ref: '#/components/schemas/GenerateResponse'
        - type: object
          properties:
            columns: {type: array, items: {type: string}}
            rows: {type: array, items: {type: array, items: {}}}
            row_count: {type: integer}
            truncated: {type: boolean, description: More rows existed than the max-rows limit}
            elapsed_ms: {type: number}
            summary: {type: string, nullable: true, description: 'Plain-English summary of the rows; present only when nl2sql.summary.enabled is true (off by default, it sends result rows to the LLM)'}
    Error:
      type: object
      properties: {error: {type: string}}
security:
  - apiKey: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check (no key needed)
      responses: {'200': {description: OK}}
  /v1/info:
    get:
      summary: Database name, type, schema and table count
      responses: {'200': {description: OK}, '401': {description: Missing or wrong X-API-Key}}
  /v1/schema:
    get:
      summary: The tables and columns the model can see
      responses: {'200': {description: OK}}
  /v1/schema/refresh:
    post:
      summary: Re-read the schema after database changes
      responses: {'200': {description: OK}}
  /v1/ask:
    post:
      summary: Question -> SQL -> rows
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AskRequest'}}}}
      responses:
        '200': {description: Answer, clarification request, or an error the model could not correct, content: {application/json: {schema: {$ref: '#/components/schemas/AskResponse'}}}}
        '400': {description: Bad request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: The LLM call failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: The database could not be read, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/generate:
    post:
      summary: Question -> validated SQL (not run)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AskRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GenerateResponse'}}}}
  /v1/examples:
    post:
      summary: Store a verified question/SQL pair used as a few-shot example
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [question, sql], properties: {question: {type: string}, sql: {type: string}}}}}
      responses: {'201': {description: Stored}, '400': {description: SQL rejected by the guardrails}}
